name: 功能建议
description: 提出新的使用场景或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue，并阅读[架构说明](https://github.com/WindDrift/fuck-pangguai/blob/master/docs/architecture.md)中的非目标范围。

        不接收绕过定位、实名、风控或支付校验的需求，也不接收逆向材料与官方反编译代码。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 现在遇到了什么问题？为什么现有功能不够用？
      placeholder: 描述真实场景，而不是只写“希望增加某功能”
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望应用如何解决这个问题？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 考虑过哪些其他做法？为什么不合适？

  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 涉及哪些页面、模块或权限？是否需要真机验证？

  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认
      options:
        - label: 已搜索现有 Issue
          required: true
        - label: 建议不涉及绕过平台校验或提交逆向材料
          required: true
