# Release workflow
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          APP_SECRET: ${{ secrets.QIEKJ_APP_SECRET }}
          LOCATION_SECRET: ${{ secrets.QIEKJ_LOCATION_SECRET }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD APP_SECRET LOCATION_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          QIEKJ_APP_SECRET: ${{ secrets.QIEKJ_APP_SECRET }}
          QIEKJ_LOCATION_SECRET: ${{ secrets.QIEKJ_LOCATION_SECRET }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Prepare release assets
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -n 1)
          test -n "$VERSION_NAME"
          APK_NAME="fuck-pangguai-${VERSION_NAME}.apk"
          ARTIFACT_NAME="fuck-pangguai-${VERSION_NAME}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          path: |
            ${{ env.APK_NAME }}
            app/build/outputs/mapping/release/mapping.txt

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          PREV_TAG=$(git tag --sort=-v:refname --list 'v*' | grep -vx "$GITHUB_REF_NAME" | head -n1 || true)
          if [ -n "$PREV_TAG" ]; then
            SUBJECTS=$(git log --no-merges --pretty=format:'%s' "${PREV_TAG}..${GITHUB_REF_NAME}" | grep -vE '^chore\(release\):' || true)
          else
            SUBJECTS=$(git log --no-merges --pretty=format:'%s' -n 50 "$GITHUB_REF_NAME" | grep -vE '^chore\(release\):' || true)
          fi
          NOTES="$RUNNER_TEMP/release-notes.md"
          echo "## 更新内容" > "$NOTES"
          echo >> "$NOTES"
          COUNT=0
          emit_group() {
            local title="$1"
            local pattern="$2"
            local items
            items=$(printf '%s\n' "$SUBJECTS" | grep -E "$pattern" | sed -E 's/^[a-z]+(\([^)]*\))?!?:[[:space:]]*//' || true)
            if [ -z "$items" ]; then
              return 0
            fi
            COUNT=$((COUNT + 1))
            {
              echo "### $title"
              echo
              printf '%s\n' "$items" | sed 's/^/- /'
              echo
            } >> "$NOTES"
          }
          emit_group "新功能" '^feat(\([^)]*\))?!?:'
          emit_group "修复" '^fix(\([^)]*\))?!?:'
          emit_group "性能" '^perf(\([^)]*\))?!?:'
          emit_group "重构" '^refactor(\([^)]*\))?!?:'
          emit_group "文档" '^docs(\([^)]*\))?!?:'
          emit_group "测试" '^test(\([^)]*\))?!?:'
          emit_group "构建" '^(build|ci)(\([^)]*\))?!?:'
          emit_group "样式" '^style(\([^)]*\))?!?:'
          OTHER=$(printf '%s\n' "$SUBJECTS" | grep -vE '^(feat|fix|perf|refactor|docs|test|build|ci|style)(\([^)]*\))?!?:' | grep -vE '^[[:space:]]*$' || true)
          if [ -n "$OTHER" ]; then
            COUNT=$((COUNT + 1))
            {
              echo "### 其他"
              echo
              printf '%s\n' "$OTHER" | sed 's/^/- /'
              echo
            } >> "$NOTES"
          fi
          if [ "$COUNT" -eq 0 ]; then
            echo "- 常规维护与问题修复。" >> "$NOTES"
            echo >> "$NOTES"
          fi
          if [ -n "$PREV_TAG" ]; then
            echo "**完整变更**：[${PREV_TAG}...${GITHUB_REF_NAME}](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME})" >> "$NOTES"
          fi
          cat "$NOTES"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("$APK_NAME")
          mapping=app/build/outputs/mapping/release/mapping.txt
          if [ -f "$mapping" ]; then
            assets+=("$mapping")
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
